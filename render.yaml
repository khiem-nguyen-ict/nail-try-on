services:
  - type: web
    name: nail-try-on
    runtime: docker
    plan: free
    envVars:
      - key: ROBOFLOW_API_KEY
        sync: false
      - key: NAIL_ALPHA
        value: 0.4
      - key: NAIL_BLUR
        value: 2
      - key: SPACE_DETECTION_THRESHOLD
        value: 0.1
      - key: YOLO_CONFIDENCE_THRESHOLD
        value: 0.5
      - key: MAX_DETECTION_DIM
        value: "320"
      - key: MAX_PROCESS_FPS
        value: "20"
      - key: NO_HAND_COOLDOWN
        value: "1.0"
      - key: ROBOFLOW_MAX_DIM
        value: "640"
