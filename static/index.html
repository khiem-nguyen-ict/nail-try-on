<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nail Try-On</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 0;
            background: #000;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        #startBtn {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 16px 32px;
            font-size: 18px;
            background: #fff;
            color: #000;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            z-index: 10;
        }
        #startBtn.hidden { display: none; }
        #output {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: contain;
            background: #000;
            display: block;
        }
        #video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            opacity: 0;
            pointer-events: none;
            z-index: -1;
        }
        #status, #latency {
            position: fixed;
            left: 20px;
            color: #aaa;
            font-size: 14px;
            margin: 0;
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
        }
        #status { top: 20px; }
        #latency { top: 44px; font-size: 12px; }
    </style>
</head>
<body>
    <h1>Nail Try-On</h1>
    <button id="startBtn">Start Camera</button>
    <img id="output" />
    <video id="video" autoplay playsinline webkit-playsinline></video>
    
    <p id="status">Session ID: <span id="sessionId">-</span></p>
    <p id="latency"></p>
    
    <script>
        const video = document.getElementById('video');
        const output = document.getElementById('output');
        const statusEl = document.getElementById('status');
        const sessionIdEl = document.getElementById('sessionId');
        const latencyEl = document.getElementById('latency');
        const startBtn = document.getElementById('startBtn');
        
        let ws = null;
        let stream = null;
        let canvas = null;
        let ctx = null;
        let sending = false;
        let processing = false;
        let frameCount = 0;
        let lastFpsTime = Date.now();
        
        function generateUUID() {
            return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
                var r = Math.random() * 16 | 0, v = c == 'x' ? r : (r & 0x3 | 0x8);
                return v.toString(16);
            });
        }
        
        async function startCamera() {
            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        width: { ideal: 640 },
                        height: { ideal: 480 },
                        facingMode: "environment"
                    }
                });
                video.srcObject = stream;
                
                const settings = stream.getVideoTracks()[0].getSettings();
                const width = settings.width || 640;
                const height = settings.height || 480;
                
                const maxDim = 640;
                const scale = Math.min(1, maxDim / Math.max(width, height));
                const canvasWidth = Math.round(width * scale);
                const canvasHeight = Math.round(height * scale);
                
                const sessionId = generateUUID();
                sessionIdEl.textContent = sessionId;
                
                const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
                ws = new WebSocket(`${protocol}//${location.host}/ws/${sessionId}`);
                ws.binaryType = 'arraybuffer';
                
                ws.onopen = () => {
                    statusEl.textContent = `Connected — ${canvasWidth}x${canvasHeight}`;
                    sending = true;
                    canvas = document.createElement('canvas');
                    canvas.width = canvasWidth;
                    canvas.height = canvasHeight;
                    ctx = canvas.getContext('2d');
                    sendFrames();
                };
                
                ws.onmessage = (event) => {
                    const blob = new Blob([event.data], { type: 'image/JPEG' });
                    output.src = URL.createObjectURL(blob);
                    processing = false;
                    
                    const now = Date.now();
                    frameCount++;
                    if (now - lastFpsTime >= 1000) {
                        latencyEl.textContent = `FPS: ${frameCount}`;
                        frameCount = 0;
                        lastFpsTime = now;
                    }
                };
                
                ws.onclose = () => {
                    statusEl.textContent = 'Disconnected';
                    sending = false;
                    processing = false;
                };
                
                ws.onerror = (err) => {
                    console.error('WebSocket error:', err);
                    statusEl.textContent = 'Connection error';
                };
                
                startBtn.classList.add('hidden');
            } catch (err) {
                console.error('Camera error:', err);
                statusEl.textContent = 'Camera access denied or unavailable';
            }
        }
        
        startBtn.addEventListener('click', startCamera);
        
        async function sendFrames() {
            if (!sending || !ws || ws.readyState !== WebSocket.OPEN) return;
            if (processing) {
                setTimeout(sendFrames, 50);
                return;
            }
            
            processing = true;
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            try {
                const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/JPEG', 1));
                const arrayBuffer = await blob.arrayBuffer();
                ws.send(arrayBuffer);
            } catch (e) {
                console.error('Frame capture error:', e);
                processing = false;
            }
            
            setTimeout(sendFrames, 50);
        }
    </script>
</body>
</html>
