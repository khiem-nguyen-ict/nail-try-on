<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nail Try-On</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 0;
            background: #000;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        #startBtn {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 16px 32px;
            font-size: 18px;
            background: #fff;
            color: #000;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            z-index: 10;
        }
        #startBtn.hidden { display: none; }
        #switchCamBtn {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: none;
            background: rgba(0, 0, 0, 0.6);
            color: #fff;
            font-size: 22px;
            cursor: pointer;
            z-index: 30;
            backdrop-filter: blur(8px);
            display: none;
        }
        #output {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            object-fit: cover;
            object-position: center;
            background: #000;
            display: block;
        }
        #video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            object-fit: cover;
            object-position: center;
            opacity: 0;
            pointer-events: none;
            z-index: -1;
            display: block;
        }
        #status, #latency {
            position: fixed;
            left: 20px;
            color: #aaa;
            font-size: 14px;
            margin: 0;
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
        }
        #status { top: 20px; }
        #latency { top: 44px; font-size: 12px; }
        
        /* Color palette bar.
           NOTE: we deliberately do NOT use `display:flex` + `justify-content:
           center` here. On iOS Safari that combination breaks horizontal
           scrolling — the centered content gets offset and you can scroll to
           the right end but never back to the left/start, so the first color
           swatches become unreachable. Instead we use a block container with
           text-align:center + white-space:nowrap, which centers the row when
           it fits AND lets you drag-scroll to both edges when it overflows.
           `font-size: 0` kills the inline whitespace gap between bubbles. */
        #colorBar {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 30px;
            display: block;
            overflow-x: auto;
            overflow-y: hidden;
            text-align: center;
            white-space: nowrap;
            font-size: 0;
            padding: 12px 20px;
            background: rgba(0, 0, 0, 0.6);
            z-index: 20;
            backdrop-filter: blur(8px);
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }
        #colorBar::-webkit-scrollbar { display: none; }
        .color-bubble {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            vertical-align: middle;
            margin: 0 7px;
            font-size: 14px;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            border: 3px solid transparent;
            transition: transform 0.15s ease, border-color 0.15s ease;
            flex-shrink: 0;
        }
        .color-bubble:hover {
            transform: scale(1.15);
        }
        .color-bubble.selected {
            border-color: #fff;
            box-shadow: 0 0 0 2px rgba(255,255,255,0.4);
            transform: scale(1.1);
        }
        
        /* Opacity slider bar */
        #opacityBar {
            position: fixed;
            bottom: 90px;
            left: 50%;
            margin: 16px;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 16px;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 20px;
            z-index: 20;
            backdrop-filter: blur(8px);
            color: #fff;
            font-size: 14px;
        }
        #opacityBar input[type="range"] {
            width: 160px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>Nail Try-On</h1>
    <button id="startBtn">Try It On</button>
    <button id="switchCamBtn" aria-label="Switch camera">⇄</button>
    <img id="output" />
    <video id="video" autoplay playsinline webkit-playsinline></video>
    
    <p id="status">Session ID: <span id="sessionId">-</span></p>
    <p id="latency"></p>
    
    <div id="colorBar">
        <div class="color-bubble selected" data-color="#FF0000" style="background:#FF0000;" title="Red"></div>
        <div class="color-bubble" data-color="#FF69B4" style="background:#FF69B4;" title="Pink"></div>
        <div class="color-bubble" data-color="#800080" style="background:#800080;" title="Purple"></div>
        <div class="color-bubble" data-color="#0000FF" style="background:#0000FF;" title="Blue"></div>
        <div class="color-bubble" data-color="#00FFFF" style="background:#00FFFF;" title="Cyan"></div>
        <div class="color-bubble" data-color="#00FF00" style="background:#00FF00;" title="Green"></div>
        <div class="color-bubble" data-color="#FFFF00" style="background:#FFFF00;" title="Yellow"></div>
        <div class="color-bubble" data-color="#FFA500" style="background:#FFA500;" title="Orange"></div>
        <div class="color-bubble" data-color="#8B4513" style="background:#8B4513;" title="Brown"></div>
        <div class="color-bubble" data-color="#000000" style="background:#000000;" title="Black"></div>
        <div class="color-bubble" data-color="#FFFFFF" style="background:#FFFFFF;" title="White"></div>
    </div>
    
    <div id="opacityBar">
        <input type="range" id="opacitySlider" min="0.1" max="0.8" step="0.1" value="0.4" />
        <span id="opacityValue">40%</span>
    </div>
    
    <script>
        const video = document.getElementById('video');
        const output = document.getElementById('output');
        const statusEl = document.getElementById('status');
        const sessionIdEl = document.getElementById('sessionId');
        const latencyEl = document.getElementById('latency');
        const startBtn = document.getElementById('startBtn');
        const switchCamBtn = document.getElementById('switchCamBtn');
        
        let ws = null;
        let stream = null;
        let facingMode = 'environment';
        let canvas = null;
        let ctx = null;
        let sending = false;
        let processing = false;
        let frameCount = 0;
        let lastFpsTime = Date.now();
        
        function generateUUID() {
            return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
                var r = Math.random() * 16 | 0, v = c == 'x' ? r : (r & 0x3 | 0x8);
                return v.toString(16);
            });
        }
        
        function isMobileOrTablet() {
            return /Android|iPhone|iPad|iPod|Windows Phone|Tablet|Mobile/i.test(navigator.userAgent)
                || (navigator.maxTouchPoints > 0);
        }

        async function acquireCamera() {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                stream = null;
            }
            stream = await navigator.mediaDevices.getUserMedia({
                video: {
                    width: { ideal: 640 },
                    height: { ideal: 480 },
                    facingMode: facingMode
                }
            });
            video.srcObject = stream;
            // Invalidate cached geometry so it recomputes for the new source.
            captureGeo = null;
        }

        function setupWebSocket() {
            if (ws && ws.readyState === WebSocket.OPEN) return;
            const sessionId = generateUUID();
            sessionIdEl.textContent = sessionId;

            const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(`${protocol}//${location.host}/ws/${sessionId}?color=${encodeURIComponent(selectedColor)}&opacity=${defaultOpacity}`);
            ws.binaryType = 'arraybuffer';

            ws.onopen = () => {
                statusEl.textContent = 'Connected';
                sending = true;
                canvas = document.createElement('canvas');
                canvas.width = 1;
                canvas.height = 1;
                ctx = canvas.getContext('2d');
                sendFrames();
            };

            ws.onmessage = (event) => {
                const blob = new Blob([event.data], { type: 'image/JPEG' });
                output.src = URL.createObjectURL(blob);
                processing = false;

                const now = Date.now();
                frameCount++;
                if (now - lastFpsTime >= 1000) {
                    latencyEl.textContent = `FPS: ${frameCount}`;
                    frameCount = 0;
                    lastFpsTime = now;
                }
            };

            ws.onclose = () => {
                statusEl.textContent = 'Disconnected';
                sending = false;
                processing = false;
            };

            ws.onerror = (err) => {
                console.error('WebSocket error:', err);
                statusEl.textContent = 'Connection error';
            };
        }

        async function startCamera() {
            try {
                await acquireCamera();
                setupWebSocket();
                startBtn.classList.add('hidden');
            } catch (err) {
                console.error('Camera error:', err);
                statusEl.textContent = 'Camera access denied or unavailable';
            }
        }

        async function switchCamera() {
            facingMode = facingMode === 'environment' ? 'user' : 'environment';
            try {
                await acquireCamera();
            } catch (err) {
                console.error('Camera switch error:', err);
                statusEl.textContent = 'Camera switch unavailable';
            }
        }

        startBtn.addEventListener('click', startCamera);
        if (switchCamBtn) {
            switchCamBtn.addEventListener('click', switchCamera);
        }

        // Only show the switch-camera button on mobile/tablet devices.
        if (isMobileOrTablet()) {
            switchCamBtn.style.display = 'flex';
        }
        
        // Color palette logic
        let selectedColor = '#FF0000';
        let defaultOpacity = 0.4;
        const bubbles = document.querySelectorAll('.color-bubble');
        
        bubbles.forEach(bubble => {
            bubble.addEventListener('click', () => {
                bubbles.forEach(b => b.classList.remove('selected'));
                bubble.classList.add('selected');
                selectedColor = bubble.getAttribute('data-color');
                if (ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({ type: 'color', value: selectedColor }));
                }
            });
        });
        
        // Opacity slider logic
        const opacitySlider = document.getElementById('opacitySlider');
        const opacityValueEl = document.getElementById('opacityValue');
        
        function updateOpacity(val) {
            opacityValueEl.textContent = Math.round(val * 100) + '%';
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: 'opacity', value: parseFloat(val) }));
            }
        }
        
        opacitySlider.addEventListener('input', (e) => {
            updateOpacity(e.target.value);
        });
        
        let captureGeo = null;
        const MAX_CAPTURE_DIM = 640;
        const MAX_SEND_FPS = 10;
        
        // Compute the portion of the video frame that is actually visible
        // through #output's object-fit:cover (i.e. the center-cropped region
        // that fills the screen). Only this rectangle is sent to the backend,
        // so the processed result matches exactly what the user sees and the
        // hidden sides of the camera feed are never transmitted.
        function computeCaptureGeometry() {
            const vw = video.videoWidth, vh = video.videoHeight;
            if (!vw || !vh) return null;
            const box = output.getBoundingClientRect();
            const dw = Math.round(box.width), dh = Math.round(box.height);
            if (!dw || !dh) return null;
            
            const videoAspect = vw / vh;
            const viewAspect = dw / dh;
            let sx, sy, sw, sh;
            if (videoAspect > viewAspect) {
                // Video is wider than the viewport: crop the left/right edges.
                sh = vh;
                sw = Math.round(vh * viewAspect);
                sx = Math.round((vw - sw) / 2);
                sy = 0;
            } else {
                // Video is taller than the viewport: crop the top/bottom edges.
                sw = vw;
                sh = Math.round(vw / viewAspect);
                sx = 0;
                sy = Math.round((vh - sh) / 2);
            }
            
            // Downscale the visible region for the backend; never upscale.
            const scale = Math.min(1, MAX_CAPTURE_DIM / Math.max(sw, sh));
            const cw = Math.round(sw * scale);
            const ch = Math.round(sh * scale);
            return { sx, sy, sw, sh, cw, ch };
        }
        
        async function sendFrames() {
            if (!sending || !ws || ws.readyState !== WebSocket.OPEN) return;
            if (processing) {
                setTimeout(sendFrames, 1000 / MAX_SEND_FPS);
                return;
            }
            
            const geo = computeCaptureGeometry();
            if (!geo) {
                // Camera metadata not ready yet; retry shortly.
                setTimeout(sendFrames, 1000 / MAX_SEND_FPS);
                return;
            }
            
            // Resize the canvas only when the visible region changes size
            // (e.g. on orientation change or address-bar show/hide).
            if (captureGeo === null || canvas.width !== geo.cw || canvas.height !== geo.ch) {
                canvas.width = geo.cw;
                canvas.height = geo.ch;
                captureGeo = geo;
                statusEl.textContent = `Connected — ${geo.cw}x${geo.ch}`;
            }
            
            processing = true;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            // Draw only the visible (cover-cropped) portion of the video.
            ctx.drawImage(video, geo.sx, geo.sy, geo.sw, geo.sh, 0, 0, canvas.width, canvas.height);
            
            try {
                const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/JPEG', 1));
                const arrayBuffer = await blob.arrayBuffer();
                ws.send(arrayBuffer);
            } catch (e) {
                console.error('Frame capture error:', e);
                processing = false;
            }
            
            setTimeout(sendFrames, 1000 / MAX_SEND_FPS);
        }
    </script>
</body>
</html>
