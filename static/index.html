<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nail Try-On</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            text-align: center;
            padding: 20px;
            background: #f5f5f5;
        }
        h1 { color: #333; margin-bottom: 10px; }
        .container {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            margin: 20px 0;
        }
        .panel {
            background: white;
            padding: 10px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .panel h3 {
            margin: 0 0 10px 0;
            color: #555;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        #video, #output {
            width: 480px;
            height: 360px;
            background: #000;
            border-radius: 4px;
            display: block;
        }
        .controls {
            margin: 20px 0;
        }
        button {
            padding: 12px 24px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            border-radius: 6px;
            background: #2563eb;
            color: white;
            transition: background 0.2s;
        }
        button:hover { background: #1d4ed8; }
        button:disabled { background: #94a3b8; cursor: not-allowed; }
        #status {
            margin-top: 10px;
            color: #666;
            font-size: 14px;
        }
        #latency {
            margin-top: 5px;
            color: #888;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <h1>Nail Try-On</h1>
    <div class="container">
        <div class="panel">
            <h3>Webcam</h3>
            <video id="video" autoplay playsinline></video>
        </div>
        <div class="panel">
            <h3>Processed</h3>
            <img id="output" />
        </div>
    </div>
    <div class="controls">
        <button id="startBtn">Start Camera</button>
    </div>
    <p id="status">Session ID: <span id="sessionId">-</span></p>
    <p id="latency"></p>
    
    <script>
        const video = document.getElementById('video');
        const output = document.getElementById('output');
        const startBtn = document.getElementById('startBtn');
        const statusEl = document.getElementById('status');
        const sessionIdEl = document.getElementById('sessionId');
        const latencyEl = document.getElementById('latency');
        
        let ws = null;
        let stream = null;
        let canvas = null;
        let ctx = null;
        let sending = false;
        let processing = false;
        let frameCount = 0;
        let lastFpsTime = Date.now();
        
        function generateUUID() {
            return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
                var r = Math.random() * 16 | 0, v = c == 'x' ? r : (r & 0x3 | 0x8);
                return v.toString(16);
            });
        }
        
        startBtn.addEventListener('click', async () => {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                if (ws) ws.close();
                startBtn.textContent = 'Start Camera';
                sending = false;
                sessionIdEl.textContent = '-';
                return;
            }
            
            try {
                stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { width: 640, height: 480, facingMode: "user" } 
                });
                video.srcObject = stream;
                
                const sessionId = generateUUID();
                sessionIdEl.textContent = sessionId;
                
                const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
                ws = new WebSocket(`${protocol}//${location.host}/ws/${sessionId}`);
                ws.binaryType = 'arraybuffer';
                
                ws.onopen = () => {
                    statusEl.textContent = 'Connected — processing frames';
                    startBtn.textContent = 'Stop';
                    sending = true;
                    canvas = document.createElement('canvas');
                    canvas.width = 640;
                    canvas.height = 480;
                    ctx = canvas.getContext('2d');
                    sendFrames();
                };
                
                ws.onmessage = (event) => {
                    const blob = new Blob([event.data], { type: 'image/jpeg' });
                    output.src = URL.createObjectURL(blob);
                    processing = false;
                    
                    const now = Date.now();
                    frameCount++;
                    if (now - lastFpsTime >= 1000) {
                        latencyEl.textContent = `FPS: ${frameCount}`;
                        frameCount = 0;
                        lastFpsTime = now;
                    }
                };
                
                ws.onclose = () => {
                    statusEl.textContent = 'Disconnected';
                    sending = false;
                    processing = false;
                };
                
                ws.onerror = (err) => {
                    console.error('WebSocket error:', err);
                    statusEl.textContent = 'Connection error';
                };
            } catch (err) {
                console.error('Camera error:', err);
                statusEl.textContent = 'Camera access denied or unavailable';
            }
        });
        
        async function sendFrames() {
            if (!sending || !ws || ws.readyState !== WebSocket.OPEN) return;
            if (processing) {
                setTimeout(sendFrames, 50);
                return;
            }
            
            processing = true;
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            try {
                const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', 0.8));
                const arrayBuffer = await blob.arrayBuffer();
                ws.send(arrayBuffer);
            } catch (e) {
                console.error('Frame capture error:', e);
                processing = false;
            }
            
            setTimeout(sendFrames, 50);
        }
    </script>
</body>
</html>
