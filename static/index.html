<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nail Try-On</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 0;
            background: #000;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        #startBtn {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 16px 32px;
            font-size: 18px;
            background: #fff;
            color: #000;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            z-index: 10;
        }
        #startBtn.hidden { display: none; }
        #output {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: contain;
            background: #000;
            display: block;
        }
        #video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            opacity: 0;
            pointer-events: none;
            z-index: -1;
        }
        #status, #latency {
            position: fixed;
            left: 20px;
            color: #aaa;
            font-size: 14px;
            margin: 0;
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
        }
        #status { top: 20px; }
        #latency { top: 44px; font-size: 12px; }
        
        /* Color palette bar */
        #colorBar {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 14px;
            padding: 12px 20px;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 40px;
            z-index: 20;
            backdrop-filter: blur(8px);
        }
        .color-bubble {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            border: 3px solid transparent;
            transition: transform 0.15s ease, border-color 0.15s ease;
            flex-shrink: 0;
        }
        .color-bubble:hover {
            transform: scale(1.15);
        }
        .color-bubble.selected {
            border-color: #fff;
            box-shadow: 0 0 0 2px rgba(255,255,255,0.4);
            transform: scale(1.1);
        }
        
        /* Opacity slider bar */
        #opacityBar {
            position: fixed;
            bottom: 90px;
            left: 50%;
            margin: 16px;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 16px;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 20px;
            z-index: 20;
            backdrop-filter: blur(8px);
            color: #fff;
            font-size: 14px;
        }
        #opacityBar input[type="range"] {
            width: 160px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>Nail Try-On</h1>
    <button id="startBtn">Start Camera</button>
    <img id="output" />
    <video id="video" autoplay playsinline webkit-playsinline></video>
    
    <p id="status">Session ID: <span id="sessionId">-</span></p>
    <p id="latency"></p>
    
    <div id="colorBar">
        <div class="color-bubble selected" data-color="#FF0000" style="background:#FF0000;" title="Red"></div>
        <div class="color-bubble" data-color="#FF69B4" style="background:#FF69B4;" title="Pink"></div>
        <div class="color-bubble" data-color="#800080" style="background:#800080;" title="Purple"></div>
        <div class="color-bubble" data-color="#0000FF" style="background:#0000FF;" title="Blue"></div>
        <div class="color-bubble" data-color="#00FFFF" style="background:#00FFFF;" title="Cyan"></div>
        <div class="color-bubble" data-color="#00FF00" style="background:#00FF00;" title="Green"></div>
        <div class="color-bubble" data-color="#FFFF00" style="background:#FFFF00;" title="Yellow"></div>
        <div class="color-bubble" data-color="#FFA500" style="background:#FFA500;" title="Orange"></div>
        <div class="color-bubble" data-color="#8B4513" style="background:#8B4513;" title="Brown"></div>
        <div class="color-bubble" data-color="#000000" style="background:#000000;" title="Black"></div>
        <div class="color-bubble" data-color="#FFFFFF" style="background:#FFFFFF;" title="White"></div>
    </div>
    
    <div id="opacityBar">
        <span id="opacityLabel">Opacity</span>
        <input type="range" id="opacitySlider" min="0.1" max="0.8" step="0.1" value="0.4" />
        <span id="opacityValue">40%</span>
    </div>
    
    <script>
        const video = document.getElementById('video');
        const output = document.getElementById('output');
        const statusEl = document.getElementById('status');
        const sessionIdEl = document.getElementById('sessionId');
        const latencyEl = document.getElementById('latency');
        const startBtn = document.getElementById('startBtn');
        
        let ws = null;
        let stream = null;
        let canvas = null;
        let ctx = null;
        let sending = false;
        let processing = false;
        let frameCount = 0;
        let lastFpsTime = Date.now();
        
        function generateUUID() {
            return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
                var r = Math.random() * 16 | 0, v = c == 'x' ? r : (r & 0x3 | 0x8);
                return v.toString(16);
            });
        }
        
        async function startCamera() {
            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        width: { ideal: 640 },
                        height: { ideal: 480 },
                        facingMode: "environment"
                    }
                });
                video.srcObject = stream;
                
                const settings = stream.getVideoTracks()[0].getSettings();
                const width = settings.width || 640;
                const height = settings.height || 480;
                
                const maxDim = 640;
                const scale = Math.min(1, maxDim / Math.max(width, height));
                const canvasWidth = Math.round(width * scale);
                const canvasHeight = Math.round(height * scale);
                
                const sessionId = generateUUID();
                sessionIdEl.textContent = sessionId;
                
                const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
                ws = new WebSocket(`${protocol}//${location.host}/ws/${sessionId}?color=${encodeURIComponent(selectedColor)}&opacity=${defaultOpacity}`);
                ws.binaryType = 'arraybuffer';
                
                ws.onopen = () => {
                    statusEl.textContent = `Connected — ${canvasWidth}x${canvasHeight}`;
                    sending = true;
                    canvas = document.createElement('canvas');
                    canvas.width = canvasWidth;
                    canvas.height = canvasHeight;
                    ctx = canvas.getContext('2d');
                    sendFrames();
                };
                
                ws.onmessage = (event) => {
                    const blob = new Blob([event.data], { type: 'image/JPEG' });
                    output.src = URL.createObjectURL(blob);
                    processing = false;
                    
                    const now = Date.now();
                    frameCount++;
                    if (now - lastFpsTime >= 1000) {
                        latencyEl.textContent = `FPS: ${frameCount}`;
                        frameCount = 0;
                        lastFpsTime = now;
                    }
                };
                
                ws.onclose = () => {
                    statusEl.textContent = 'Disconnected';
                    sending = false;
                    processing = false;
                };
                
                ws.onerror = (err) => {
                    console.error('WebSocket error:', err);
                    statusEl.textContent = 'Connection error';
                };
                
                startBtn.classList.add('hidden');
            } catch (err) {
                console.error('Camera error:', err);
                statusEl.textContent = 'Camera access denied or unavailable';
            }
        }
        
        startBtn.addEventListener('click', startCamera);
        
        // Color palette logic
        let selectedColor = '#FF0000';
        let defaultOpacity = 0.4;
        const bubbles = document.querySelectorAll('.color-bubble');
        
        bubbles.forEach(bubble => {
            bubble.addEventListener('click', () => {
                bubbles.forEach(b => b.classList.remove('selected'));
                bubble.classList.add('selected');
                selectedColor = bubble.getAttribute('data-color');
                if (ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({ type: 'color', value: selectedColor }));
                }
            });
        });
        
        // Opacity slider logic
        const opacitySlider = document.getElementById('opacitySlider');
        const opacityValueEl = document.getElementById('opacityValue');
        
        function updateOpacity(val) {
            opacityValueEl.textContent = Math.round(val * 100) + '%';
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: 'opacity', value: parseFloat(val) }));
            }
        }
        
        opacitySlider.addEventListener('input', (e) => {
            updateOpacity(e.target.value);
        });
        
        async function sendFrames() {
            if (!sending || !ws || ws.readyState !== WebSocket.OPEN) return;
            if (processing) {
                setTimeout(sendFrames, 50);
                return;
            }
            
            processing = true;
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            try {
                const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/JPEG', 1));
                const arrayBuffer = await blob.arrayBuffer();
                ws.send(arrayBuffer);
            } catch (e) {
                console.error('Frame capture error:', e);
                processing = false;
            }
            
            setTimeout(sendFrames, 50);
        }
    </script>
</body>
</html>
