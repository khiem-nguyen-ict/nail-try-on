<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nail Try-On</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 0;
            background: #000;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        .center-buttons {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            gap: 24px;
            z-index: 10;
        }
        .center-buttons button {
            width: 72px;
            height: 72px;
            border-radius: 18px;
            border: none;
            background: #fff;
            color: #000;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            transition: transform 0.15s ease, opacity 0.15s ease;
        }
        .center-buttons button:hover {
            transform: scale(1.05);
            opacity: 0.95;
        }
        .center-buttons button:active {
            transform: scale(0.95);
        }
        #startBtn.hidden { display: none; }
        #switchCamBtn {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: none;
            background: rgba(0, 0, 0, 0.6);
            color: #fff;
            cursor: pointer;
            z-index: 30;
            backdrop-filter: blur(8px);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 0;
        }
        #backBtn {
            position: fixed;
            top: 20px;
            left: 20px;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: none;
            background: rgba(0, 0, 0, 0.6);
            color: #fff;
            cursor: pointer;
            z-index: 30;
            backdrop-filter: blur(8px);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 0;
        }
        #loadingSpinner {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 48px;
            height: 48px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            z-index: 40;
            display: none;
            pointer-events: none;
        }
        @keyframes spin {
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }
        #output {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            object-fit: contain;
            object-position: center;
            background: #000;
            display: block;
        }
        #video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            object-fit: cover;
            object-position: center;
            opacity: 0;
            pointer-events: none;
            z-index: -1;
            display: block;
        }
        
        #colorBar {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 30px;
            display: block;
            overflow-x: auto;
            overflow-y: hidden;
            text-align: center;
            white-space: nowrap;
            font-size: 0;
            padding: 12px 20px;
            z-index: 20;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }
        #colorBar::-webkit-scrollbar { display: none; }
        .color-bubble {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            vertical-align: middle;
            margin: 0 7px;
            font-size: 14px;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            border: 3px solid transparent;
            transition: transform 0.15s ease, border-color 0.15s ease;
            flex-shrink: 0;
        }
        .color-bubble:hover {
            transform: scale(1.15);
        }
        .color-bubble.selected {
            border-color: #fff;
            box-shadow: 0 0 0 2px rgba(255,255,255,0.4);
            transform: scale(1.1);
        }
        
        /* Opacity slider bar */
        #opacityBar {
            position: fixed;
            bottom: 90px;
            left: 50%;
            margin: 8px;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 16px;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 20px;
            z-index: 20;
            backdrop-filter: blur(8px);
            color: #fff;
            font-size: 14px;
        }
        #opacityBar input[type="range"] {
            width: 160px;
            cursor: pointer;
        }

        /* Nail pattern gallery */
        #patternGallery {
            position: fixed;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            display: none;
            flex-direction: column;
            gap: 10px;
            padding: 10px;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 16px;
            z-index: 20;
            backdrop-filter: blur(8px);
        }
        #patternGallery.visible {
            display: flex;
        }
        .pattern-thumb {
            width: 64px;
            height: 96px;
            border-radius: 10px;
            border: 3px solid transparent;
            cursor: pointer;
            object-fit: contain;
            transition: transform 0.15s ease, border-color 0.15s ease;
            background: #222;
        }
        .pattern-thumb:hover {
            transform: scale(1.1);
        }
        .pattern-thumb.selected {
            border-color: #fff;
            box-shadow: 0 0 0 2px rgba(255,255,255,0.4);
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <h1>Nail Try-On</h1>
    <div class="center-buttons">
        <button id="startBtn" aria-label="Start camera">
            <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
                <circle cx="12" cy="13" r="4"/>
            </svg>
        </button>
        <button id="uploadBtn" aria-label="Upload image">
            <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                <polyline points="17 8 12 3 7 8"/>
                <line x1="12" y1="3" x2="12" y2="15"/>
            </svg>
        </button>
    </div>
    <input type="file" id="fileInput" accept="image/*" style="display:none" />
    <button id="switchCamBtn" aria-label="Switch camera">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M7 16V4m0 0L3 8m4-4l4 4"/>
        <path d="M17 8v12m0 0l4-4m-4 4l-4-4"/>
      </svg>
    </button>
    <button id="backBtn" aria-label="Back">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 12H5"/>
        <path d="M12 19l-7-7 7-7"/>
      </svg>
    </button>
    <div id="loadingSpinner"></div>
    <img id="output" />
    <video id="video" autoplay playsinline webkit-playsinline></video>
    
    <div id="colorBar">
        <div class="color-bubble selected" data-color="#722F37" style="background:#722F37;" title="Burgundy"></div>
        <div class="color-bubble" data-color="#C08081" style="background:#C08081;" title="Rose"></div>
        <div class="color-bubble" data-color="#4B0082" style="background:#4B0082;" title="Plum"></div>
        <div class="color-bubble" data-color="#000080" style="background:#000080;" title="Navy"></div>
        <div class="color-bubble" data-color="#008080" style="background:#008080;" title="Teal"></div>
        <div class="color-bubble" data-color="#228B22" style="background:#228B22;" title="Forest"></div>
        <div class="color-bubble" data-color="#B8860B" style="background:#B8860B;" title="Gold"></div>
        <div class="color-bubble" data-color="#CC5500" style="background:#CC5500;" title="Rust"></div>
        <div class="color-bubble" data-color="#8B4513" style="background:#8B4513;" title="Brown"></div>
        <div class="color-bubble" data-color="#1C1C1C" style="background:#1C1C1C;" title="Black"></div>
        <div class="color-bubble" data-color="#FFFAF0" style="background:#FFFAF0;" title="Cream"></div>
    </div>
    
    <div id="opacityBar">
        <input type="range" id="opacitySlider" min="0.1" max="0.8" step="0.1" value="{{NAIL_ALPHA}}" />
        <span id="opacityValue"></span>
    </div>

    <div id="patternGallery"></div>
    
    <script>
        const video = document.getElementById('video');
        const output = document.getElementById('output');
        const startBtn = document.getElementById('startBtn');
        const switchCamBtn = document.getElementById('switchCamBtn');
        const backBtn = document.getElementById('backBtn');
        const uploadBtn = document.getElementById('uploadBtn');
        const fileInput = document.getElementById('fileInput');
        const loadingSpinner = document.getElementById('loadingSpinner');
        const patternGallery = document.getElementById('patternGallery');

        const BACKGROUND_IMAGE = 'https://assets.vogue.com/photos/691f357cc27b47cad254eb6d/master/w_1600%2Cc_limit/SaveClip.App_579687142_18379744144178067_1109136112459296107_n.jpg';
        
        let ws = null;
        let stream = null;
        let facingMode = 'environment';
        let canvas = null;
        let ctx = null;
        let sending = false;
        let processing = false;
        let lastUploadedFile = null;
        
        function generateUUID() {
            return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
                var r = Math.random() * 16 | 0, v = c == 'x' ? r : (r & 0x3 | 0x8);
                return v.toString(16);
            });
        }
        
        function isMobileOrTablet() {
            return /Android|iPhone|iPad|iPod|Windows Phone|Tablet|Mobile/i.test(navigator.userAgent)
                || (navigator.maxTouchPoints > 0);
        }

        async function acquireCamera() {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                stream = null;
            }
            stream = await navigator.mediaDevices.getUserMedia({
                video: {
                    width: { ideal: 1280 },
                    height: { ideal: 720 },
                    facingMode: facingMode
                }
            });
            video.srcObject = stream;
            // Invalidate cached geometry so it recomputes for the new source.
            captureGeo = null;
        }

        function setupWebSocket() {
            if (ws && ws.readyState === WebSocket.OPEN) return;
            const sessionId = generateUUID();

            const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(`${protocol}//${location.host}/ws/${sessionId}?color=${encodeURIComponent(selectedColor)}&opacity=${defaultOpacity}`);
            ws.binaryType = 'arraybuffer';

            ws.onopen = () => {
                sending = true;
                canvas = document.createElement('canvas');
                canvas.width = 1;
                canvas.height = 1;
                ctx = canvas.getContext('2d');
                sendFrames();
            };

            ws.onmessage = (event) => {
                const blob = new Blob([event.data], { type: 'image/JPEG' });
                output.src = URL.createObjectURL(blob);
                output.style.opacity = 1;
                processing = false;
            };

            ws.onclose = () => {
                sending = false;
                processing = false;
            };

            ws.onerror = (err) => {
                console.error('WebSocket error:', err);
            };
        }

        function goBackToHome() {
            if (ws) {
                ws.onclose = null;
                ws.close();
                ws = null;
            }
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                stream = null;
            }
            video.srcObject = null;
            console.log('Camera stopped, remove src from output');
            output.src = BACKGROUND_IMAGE;
            output.style.opacity = 0.2;
            sending = false;
            processing = false;
            captureGeo = null;

            startBtn.classList.remove('hidden');
            uploadBtn.style.display = '';
            backBtn.style.display = 'none';
            switchCamBtn.style.display = 'none';
            fileInput.value = '';
            lastUploadedFile = null;
            loadingSpinner.style.display = 'none';
            patternGallery.classList.remove('visible');
        }

        function repaintImage() {
            if (!lastUploadedFile) return;
            processing = true;
            const formData = new FormData();
            formData.append('file', lastUploadedFile);

            startBtn.classList.add('hidden');
            uploadBtn.style.display = 'none';
            backBtn.style.display = 'flex';
            loadingSpinner.style.display = 'block';
            
            fetch(`/paint?color=${encodeURIComponent(selectedColor.replace('#', ''))}&opacity=${encodeURIComponent(opacitySlider.value)}`, {
                method: 'POST',
                body: formData,
            })
            .then(response => {
                if (!response.ok) throw new Error('Repaint failed');
                return response.blob();
            })
            .then(blob => {
                if(processing) {
                    if (output.src && output.src.startsWith('blob:')) {
                        URL.revokeObjectURL(output.src);
                    }
                    output.src = URL.createObjectURL(blob);
                    output.style.opacity = 1;
                    patternGallery.classList.add('visible');
                }   
            })
            .catch(err => {
                console.error('Repaint error:', err);
            })
            .finally(() => {
                loadingSpinner.style.display = 'none';
                processing = false;
            });
        }

        function paintWithPattern(patternFilename) {
            if (!lastUploadedFile || processing) return;
            processing = true;
            const formData = new FormData();
            formData.append('file', lastUploadedFile);

            startBtn.classList.add('hidden');
            uploadBtn.style.display = 'none';
            backBtn.style.display = 'flex';
            loadingSpinner.style.display = 'block';

            fetch(`/paint_pattern?pattern=${encodeURIComponent(patternFilename)}`, {
                method: 'POST',
                body: formData,
            })
            .then(response => {
                if (!response.ok) throw new Error('Pattern paint failed');
                return response.blob();
            })
            .then(blob => {
                if (processing) {
                    if (output.src && output.src.startsWith('blob:')) {
                        URL.revokeObjectURL(output.src);
                    }
                    output.src = URL.createObjectURL(blob);
                    output.style.opacity = 1;
                }
            })
            .catch(err => {
                console.error('Pattern paint error:', err);
            })
            .finally(() => {
                loadingSpinner.style.display = 'none';
                processing = false;
            });
        }

        async function startCamera() {
            try {
                await acquireCamera();
                setupWebSocket();
                startBtn.classList.add('hidden');
                uploadBtn.style.display = 'none';
                backBtn.style.display = 'flex';
            } catch (err) {
                console.error('Camera error:', err);
            }
        }

        async function switchCamera() {
            facingMode = facingMode === 'environment' ? 'user' : 'environment';
            try {
                await acquireCamera();
            } catch (err) {
                console.error('Camera switch error:', err);
            }
        }

        startBtn.addEventListener('click', startCamera);
        if (switchCamBtn) {
            switchCamBtn.addEventListener('click', switchCamera);
        }
        backBtn.addEventListener('click', goBackToHome);
        
        uploadBtn.addEventListener('click', () => {
            fileInput.click();
        });
        
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            lastUploadedFile = file;
            repaintImage();
        });
        
        // Only show the switch-camera button on mobile/tablet devices.
        if (isMobileOrTablet()) {
            switchCamBtn.style.display = 'flex';
        }
        
        // Color palette logic
        let selectedColor = '#722F37';
        let defaultOpacity = {{NAIL_ALPHA}};
        const bubbles = document.querySelectorAll('.color-bubble');
        
        bubbles.forEach(bubble => {
            bubble.addEventListener('click', () => {
                bubbles.forEach(b => b.classList.remove('selected'));
                bubble.classList.add('selected');
                selectedColor = bubble.getAttribute('data-color');
                if (ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({ type: 'color', value: selectedColor }));
                } else if (lastUploadedFile) {
                    repaintImage();
                }
            });
        });
        
        // Opacity slider logic
        const opacitySlider = document.getElementById('opacitySlider');
        const opacityValueEl = document.getElementById('opacityValue');
        
        function updateOpacity(val) {
            opacityValueEl.textContent = Math.round(val * 100) + '%';
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: 'opacity', value: parseFloat(val) }));
            }
        }
        
        opacitySlider.addEventListener('input', (e) => {
            updateOpacity(e.target.value);
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: 'opacity', value: parseFloat(e.target.value) }));
            } else if (lastUploadedFile) {
                repaintImage();
            }
        });

        // Pattern gallery logic
        async function loadPatterns() {
            console.log("---> load");
            try {
                const response = await fetch('/api/patterns');
                const data = await response.json();
                const gallery = document.getElementById('patternGallery');
                gallery.innerHTML = '';

                data.patterns.forEach(filename => {
                    const img = document.createElement('img');
                    img.className = 'pattern-thumb';
                    img.src = `/patterns/${filename}`;
                    img.dataset.pattern = filename;
                    img.title = filename.replace(/^sample-/, '').replace(/\.png$/i, '');
                    img.addEventListener('click', () => {
                        document.querySelectorAll('.pattern-thumb').forEach(t => t.classList.remove('selected'));
                        img.classList.add('selected');
                        paintWithPattern(img.dataset.pattern);
                    });
                    gallery.appendChild(img);
                });
            } catch (err) {
                console.error('Failed to load patterns:', err);
            }
        }

        loadPatterns();

        document.addEventListener('DOMContentLoaded', () => {
            updateOpacity(opacitySlider.value);
            output.src = BACKGROUND_IMAGE;
            output.style.opacity = 0.2;
        });
        
        let captureGeo = null;
        const MAX_CAPTURE_DIM = {{MAX_CAPTURE_DIM}};
        const MAX_SEND_FPS = {{MAX_SEND_FPS}};
        const IMAGE_QUALITY = {{IMAGE_QUALITY}};
        
        // Compute the portion of the video frame that is actually visible
        // through #output's object-fit:cover (i.e. the center-cropped region
        // that fills the screen). Only this rectangle is sent to the backend,
        // so the processed result matches exactly what the user sees and the
        // hidden sides of the camera feed are never transmitted.
        function computeCaptureGeometry() {
            const vw = video.videoWidth, vh = video.videoHeight;
            if (!vw || !vh) return null;
            const box = output.getBoundingClientRect();
            const dw = Math.round(box.width), dh = Math.round(box.height);
            if (!dw || !dh) return null;
            
            const videoAspect = vw / vh;
            const viewAspect = dw / dh;
            let sx, sy, sw, sh;
            if (videoAspect > viewAspect) {
                // Video is wider than the viewport: crop the left/right edges.
                sh = vh;
                sw = Math.round(vh * viewAspect);
                sx = Math.round((vw - sw) / 2);
                sy = 0;
            } else {
                // Video is taller than the viewport: crop the top/bottom edges.
                sw = vw;
                sh = Math.round(vw / viewAspect);
                sx = 0;
                sy = Math.round((vh - sh) / 2);
            }
            
            // Downscale the visible region for the backend; never upscale.
            const scale = Math.min(1, MAX_CAPTURE_DIM / Math.max(sw, sh));
            const cw = Math.round(sw * scale);
            const ch = Math.round(sh * scale);
            return { sx, sy, sw, sh, cw, ch };
        }
        
        async function sendFrames() {
            if (!sending || !ws || ws.readyState !== WebSocket.OPEN) return;
            if (processing) {
                setTimeout(sendFrames, 1000 / MAX_SEND_FPS);
                return;
            }
            
            const geo = computeCaptureGeometry();
            if (!geo) {
                // Camera metadata not ready yet; retry shortly.
                setTimeout(sendFrames, 1000 / MAX_SEND_FPS);
                return;
            }
            
            // Resize the canvas only when the visible region changes size
            // (e.g. on orientation change or address-bar show/hide).
            if (captureGeo === null || canvas.width !== geo.cw || canvas.height !== geo.ch) {
                canvas.width = geo.cw;
                canvas.height = geo.ch;
                captureGeo = geo;
            }
            
            processing = true;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            // Draw only the visible (cover-cropped) portion of the video.
            ctx.drawImage(video, geo.sx, geo.sy, geo.sw, geo.sh, 0, 0, canvas.width, canvas.height);
            
            try {
                const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/JPEG', IMAGE_QUALITY / 100.0));
                const arrayBuffer = await blob.arrayBuffer();
                ws.send(arrayBuffer);
            } catch (e) {
                console.error('Frame capture error:', e);
                processing = false;
            }
            
            setTimeout(sendFrames, 1000 / MAX_SEND_FPS);
        }
    </script>
</body>
</html>
